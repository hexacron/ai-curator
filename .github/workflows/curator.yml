name: AI Repository Curator

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual triggering
  push:
    branches: [ main ]
    paths:
      - 'curator.py'
      - 'generate_website.py'
      - 'config.json'
      - '.github/workflows/curator.yml'
      - 'requirements.txt'

jobs:
  curate-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

    - name: Set up Python 3.13
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Create config if it does not exist
      run: |
        if [ ! -f config.json ]; then
          echo '{}' > config.json
        fi

    - name: Run Curator Script
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python curator.py

    - name: Generate Website Files
      run: python generate_website.py

    - name: Disable Jekyll
      run: touch ./docs/.nojekyll

    - name: Setup GitHub Pages
      uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
      with:
        path: './docs'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        git add README.md docs

        if git diff --staged --quiet; then
          echo "No changes to commit."
        else
          git commit -m "Chore: Auto-update curator results and website"
          # Replay our commit on top of any newer remote commits; on conflict keep our freshly generated files.
          git pull --rebase -X theirs
          git push
        fi
